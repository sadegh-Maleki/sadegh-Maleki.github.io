<!DOCTYPE html>
<html lang="en">

<head>
    <title>Web OTP Demo</title>
</head>

<body>
    <main>
        <form id="otp-form">
            <p>
                Enter the digit you received
            </p>
            <div id="otp-field">
                <label for="otp-input">digit code</label>
                <input type="text" inputmode="numeric" is="web-otp" id="otp-input" autocomplete="one-time-code"
                    pattern="^([0-9]+)$" required />
                <button onclick="startSmsListening()"
                    style="background-color: green; color:#ffffff;padding: 10px; margin: 10px;">START LISSENING</button>
                <button onclick="test()"
                    style="background-color: orange; color:#000000;padding: 10px; margin: 10px;">TEST 5 second</button>
                <div id="otp-waite" style="display: inline-block; width: 50px; height: 20px;border: 1px solid #000; background-color:bisque; color: blue;">
                </div>
            </div>
        </form>
    </main>
</body>

</html>
<script>

    let otp = null;
    let error = null;
    let isListening = false;
    let abortController = null;

    const startOtpListener = async () => {

        // check is supported
        if (!('OTPCredential' in window)) {
            error = 'Web OTP API not supported';
            return null;
        }
        // abort old listener
        abort();
        try {
            console.log('1 - befor get');
            isListening = true;
            error = null;
            abortController = new AbortController();
            // abort after 3 min
            const timeoutId = setTimeout(() => {
                console.log('TIMEOUT FIRED');
                abortController?.abort();
            }, 180000);
            console.log('2 - start listening');
            const otp = await (navigator.credentials.get)({
                otp: { transport: ['sms'] },
                signal: abortController.signal,
            })
            console.log('3 - get resolved', otp);
            console.log('4 - CODE', otp.code);
            clearTimeout(timeoutId);
            console.log('5 - clear timeout');
            // set otp
            if (otp?.code) {
                return otp.code;
            } else {
                return null;
            }
        } catch (err) {
            console.log('REJECTED');
            console.log('NAME', err?.name);
            console.log('MSG', err?.message);
            switch (err.name) {
                case 'AbortError':
                    error = 'timeout aborted';
                    break;
                case 'NotAllowedError':
                    error = 'access denied';
                    break;
                case 'SecurityError':
                    error = 'must be Https';
                    break;
                default:
                    error = err.message ?? 'unknown error';
            }
            return null;
        } finally {
            isListening = false;
        }
    };

    const abort = () => {
        abortController?.abort();
        abortController = null;
        isListening = false;
    }

    const reset = () => {
        abort();
        otp = null;
        error = null;
    }

    const testOtpCreditional = () => {
        //  if (import.meta.env.DEV) {
        (window).OTPCredential ??= class OTPCredential { };
        navigator.credentials.get = (async () => {
            console.log('mock get called');
            await new Promise(resolve => {
                const otpWaite = document.getElementById('otp-waite');
                otpWaite.innerHTML = timeLine(15);
                let counter = 15
                const intervalid = setInterval(() => {
                    counter = counter - 3;
                    otpWaite.innerHTML = timeLine(counter);
                }, 1000);
                setTimeout(() => {
                    clearInterval(intervalid);
                    resolve();
                }, 5000);

            });
            console.log('mock get received');
            return { code: '1258' };
        });
        //  }
    }

    const timeLine = (count) => {
        if (count == 1) {
            return '|'
        }
        if (count == 2) {
            return '||'
        }
        if (count == 3) {
            return '|||'
        }
        if (count == 4) {
            return '||||'
        }
        if (count == 5) {
            return '|||||'
        }
        if (count == 6) {
            return '||||||'
        }
        if (count == 7) {
            return '|||||||'
        }
        if (count == 8) {
            return '||||||||'
        }
        if (count == 9) {
            return '|||||||||'
        }
        if (count == 10) {
            return '||||||||||'
        }
        if (count == 11) {
            return '|||||||||||'
        }
        if (count == 12) {
            return '||||||||||||'
        }
        if (count == 13) {
            return '|||||||||||||'
        }
        if (count == 14) {
            return '||||||||||||||'
        }
        if (count == 15) {
            return '|||||||||||||||'
        }else{
            return '';
        }
    }

    const startSmsListening = async () => {

        const code = await startOtpListener();
        if (code) {
            console.log('OTP code is :', code);
            const otpField = document.getElementById('otp-input');
            otpField.value = code;
        }
    }

    const test = () => {
        testOtpCreditional();
        startSmsListening();
    }
</script>
